name: Release

on:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    uses: ./.github/workflows/ci.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  release:
    name: Release
    needs: verify
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && !contains(github.event.head_commit.message, '[skip ci]')
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build package
        run: pnpm prepare

      - name: Verify package contents
        env:
          PACKAGE_MANIFEST: ${{ runner.temp }}/scanner-package-contents.json
        run: |
          npm pack --dry-run --ignore-scripts --json > "$PACKAGE_MANIFEST"
          node <<'NODE'
          const fs = require('node:fs');
          const [pkg] = JSON.parse(fs.readFileSync(process.env.PACKAGE_MANIFEST, 'utf8'));
          const files = new Set(pkg.files.map((file) => file.path));
          for (const path of [
            'lib/module/index.js',
            'lib/typescript/src/index.d.ts',
            'SimpleScanner.podspec',
            'ios/SimpleScannerView.mm',
            'android/src/main/java/com/simplescanner/BarcodeScanner.kt',
          ]) {
            if (!files.has(path)) throw new Error(`Missing release file: ${path}`);
          }
          console.log(`Verified ${files.size} package files before publishing`);
          NODE

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec semantic-release
